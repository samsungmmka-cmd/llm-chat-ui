services:
  llm-chat-ui:
    build: .
    image: llm-chat-ui:latest
    container_name: llm-chat-ui
    ports:
      - "3000:3000"          # point your nginx at this port
    environment:
      LLM_BASE_URL: /api     # what the browser calls (your nginx routes /api to the LLM)
      DEFAULT_MODEL: ""
      APP_TITLE: Lumen
      # Optional — only if your nginx does NOT route /api to the LLM:
      # LLM_UPSTREAM: http://host.docker.internal:8000/v1
      # LLM_API_KEY: ""
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"   # needed on Linux when using LLM_UPSTREAM to the host
    restart: unless-stopped
