services:
  llm-chat-ui:
    build: .
    image: llm-chat-ui:latest
    container_name: llm-chat-ui
    ports:
      - "3000:3000"          # point your nginx at this port
    environment:
      LLM_BASE_URL: /api     # what the browser calls
      DEFAULT_MODEL: ""
      APP_TITLE: Lumen
      # The container proxies /api to OpenAI and adds the key server-side.
      LLM_UPSTREAM: https://api.openai.com/v1
      LLM_API_KEY: ${OPENAI_API_KEY:-}   # export OPENAI_API_KEY before `docker compose up`
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"   # needed on Linux when using LLM_UPSTREAM to the host
    restart: unless-stopped
